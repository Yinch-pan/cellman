server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 8.210.238.62;
    ssl_certificate /etc/letsencrypt/live/cellman-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cellman-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/cellman/current/dist/web;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn cellman_conn_ip 48;
    limit_conn cellman_conn_total 240;
    limit_req zone=cellman_static_ip burst=90 nodelay;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # No HSTS on the shared IP: the existing site intentionally uses port 80.
    access_log /var/log/nginx/cellman.access.log;
    error_log /var/log/nginx/cellman.error.log;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    location ^~ /api/ {
        limit_req zone=cellman_api_ip burst=40 nodelay;
        limit_req zone=cellman_api_total burst=80 nodelay;
        # Close slow uploads before forwarding; streaming responses remain unbuffered.
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace, rather than append, untrusted client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 70s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ /\. { return 404; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

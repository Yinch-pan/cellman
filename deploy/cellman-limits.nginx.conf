# Install in /etc/nginx/conf.d/cellman-limits.conf (http context).
# Both HTTPS ports share the same budgets. Static assets have separate limits.
limit_req_zone $binary_remote_addr zone=cellman_api_ip:2m rate=10r/s;
limit_req_zone $server_name zone=cellman_api_total:1m rate=40r/s;
limit_req_zone $binary_remote_addr zone=cellman_static_ip:2m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=cellman_conn_ip:2m;
limit_conn_zone $server_name zone=cellman_conn_total:1m;

# A generous inherited ceiling protects the other HTTP site on this small host.
# Cellman's server/location rules below override these with its tighter budgets.
limit_req_zone $binary_remote_addr zone=host_web_ip:2m rate=30r/s;
limit_req_zone $hostname zone=host_web_total:1m rate=60r/s;
limit_conn_zone $binary_remote_addr zone=host_web_conn_ip:2m;
limit_conn_zone $hostname zone=host_web_conn_total:1m;
limit_req zone=host_web_ip burst=120 nodelay;
limit_req zone=host_web_total burst=120 nodelay;
limit_conn host_web_conn_ip 64;
limit_conn host_web_conn_total 320;
limit_req_status 429;
limit_conn_status 429;
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;

# The existing editor accepts http://8.210.238.62. Translate only this exact
# trusted new origin; all other origins remain unchanged and are rejected by it.
# Keep the original editor process, data store, token and editing-key checks.
map $http_origin $nature_8444_editor_origin {
    default $http_origin;
    "https://8.210.238.62:8444" "http://8.210.238.62";
}
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name 8.210.238.62;
    ssl_certificate /etc/letsencrypt/live/cellman-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cellman-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/shadow-nature/current;
    index index.html;
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\. { return 404; }
    location ^~ /api/project-levels {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:4185;
        proxy_set_header Host "8.210.238.62";
        proxy_set_header Origin $nature_8444_editor_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location = /src/authored-levels.json {
        proxy_pass http://127.0.0.1:4185;
        proxy_set_header Host $http_host;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    location / { try_files $uri $uri/ =404; }
    location = /health { try_files /version.json =503; }
}
